aid: amprius
name: Amprius Technologies
description: >-
  Amprius Technologies is a Fremont, California-based developer and
  manufacturer of high-energy density lithium-ion batteries built on a
  proprietary 100% silicon anode platform. Its flagship SiCore and SiMaxx
  cell families are marketed as among the industry's highest gravimetric
  and volumetric energy density rechargeable cells, enabling longer
  endurance, faster charging, and higher payload capacity than
  conventional graphite-anode chemistries. Amprius targets aviation and
  aerospace (high-altitude pseudo-satellites, unmanned aerial systems,
  electric vertical takeoff and landing aircraft), defense (US Army
  soldier-worn power, BAE Systems), light electric vehicles, robotics,
  and AI hardware. Public references include AALTO's Airbus-derived
  Zephyr HAPS programs, Prismatic's PHASA-35 stratospheric aircraft,
  Nokia Drone Networks, and Matternet drone delivery. The company runs
  pilot manufacturing and R&D in Fremont and is scaling a GWh-scale
  Brighton, Colorado plant alongside contract manufacturing partnerships
  in Asia. Amprius is publicly traded on the New York Stock Exchange
  under the ticker AMPX. It is certified to ISO 9001:2015 and
  AS9100:2016. Amprius sells cells, modules, and engineering services
  to OEMs and defense primes; it does not publish a developer API, SDK,
  or open-source battery telemetry interface, and has no public GitHub
  organization.
